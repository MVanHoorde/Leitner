<script>// ---- 00-outils.js ----
'use strict';

const $ = (selecteur, racine = document) => racine.querySelector(selecteur);

const comparerFr = new Intl.Collator('fr', { sensitivity: 'base', numeric: true }).compare;

/** Crée un élément DOM. Le texte passe toujours par textContent, jamais par innerHTML. */
function el(balise, attributs, ...enfants) {
  const noeud = document.createElement(balise);
  for (const [cle, valeur] of Object.entries(attributs || {})) {
    if (valeur === null || valeur === undefined || valeur === false) continue;
    if (cle === 'class') noeud.className = valeur;
    else if (cle === 'text') noeud.textContent = valeur;
    else if (cle === 'value') noeud.value = valeur;
    else if (cle.startsWith('on') && typeof valeur === 'function') noeud.addEventListener(cle.slice(2), valeur);
    else noeud.setAttribute(cle, valeur === true ? '' : String(valeur));
  }
  for (const enfant of enfants.flat()) {
    if (enfant === null || enfant === undefined || enfant === false) continue;
    noeud.append(enfant instanceof Node ? enfant : String(enfant));
  }
  return noeud;
}

function nouvelId() {
  if (typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  const octets = crypto.getRandomValues(new Uint8Array(16));
  return Array.from(octets, (o) => o.toString(16).padStart(2, '0')).join('');
}

function pluriel(n, singulier, pluriel = singulier + 's') {
  return `${n} ${n > 1 ? pluriel : singulier}`;
}

function formaterOctets(octets) {
  if (octets < 1024 * 1024) return `${Math.max(1, Math.round(octets / 1024))} Ko`;
  return `${(octets / 1024 / 1024).toLocaleString('fr-FR', { maximumFractionDigits: 1 })} Mo`;
}

/* ---------- Dates calendaires locales, au format AAAA-MM-JJ ---------- */

const Dates = {
  /** Décalage en jours, utilisé uniquement pour tester l'application. */
  decalage: 0,

  versIso(date) {
    const mm = String(date.getMonth() + 1).padStart(2, '0');
    const jj = String(date.getDate()).padStart(2, '0');
    return `${date.getFullYear()}-${mm}-${jj}`;
  },

  versDate(iso) {
    const [a, m, j] = iso.split('-').map(Number);
    return new Date(a, m - 1, j);
  },

  aujourdhui() {
    const d = new Date();
    d.setDate(d.getDate() + this.decalage);
    return this.versIso(d);
  },

  ajouter(iso, jours) {
    const d = this.versDate(iso);
    d.setDate(d.getDate() + jours);
    return this.versIso(d);
  },

  /** Nombre de jours de a à b (positif si b est après a). */
  ecart(a, b) {
    return Math.round((this.versDate(b) - this.versDate(a)) / 86400000);
  },

  formater(iso, avecJour = false) {
    const options = { day: 'numeric', month: 'long', year: 'numeric' };
    if (avecJour) options.weekday = 'long';
    return this.versDate(iso).toLocaleDateString('fr-FR', options);
  },

  depuis(jours) {
    if (jours <= 0) return "aujourd'hui";
    if (jours === 1) return 'hier';
    return `il y a ${jours} jours`;
  },
};

/* ---------- Aléatoire reproductible (données de démonstration) ---------- */

function hacherTexte(texte) {
  let h = 2166136261;
  for (const c of texte) {
    h ^= c.codePointAt(0);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function generateurAleatoire(graine) {
  let a = graine >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function melanger(tableau, alea = Math.random) {
  for (let i = tableau.length - 1; i > 0; i--) {
    const j = Math.floor(alea() * (i + 1));
    [tableau[i], tableau[j]] = [tableau[j], tableau[i]];
  }
  return tableau;
}

/* ---------- Retours à l'utilisateur ---------- */

let minuteurAnnonce = null;

function annoncer(texte) {
  const zone = $('#annonce');
  zone.textContent = texte;
  zone.hidden = false;
  clearTimeout(minuteurAnnonce);
  minuteurAnnonce = setTimeout(() => { zone.hidden = true; }, 3500);
}

/**
 * Bouton d'action destructrice avec confirmation en deux temps :
 * premier tap = explication, second tap = exécution.
 */
function confirmationDeuxTemps({ libelle, question, detail, libelleConfirmer, action, classeBouton = 'bouton danger bloc' }) {
  const zone = el('div');
  const etapeInitiale = () => {
    zone.replaceChildren(el('button', { type: 'button', class: classeBouton, onclick: etapeConfirmation }, libelle));
  };
  const etapeConfirmation = () => {
    const confirmer = el('button', { type: 'button', class: 'bouton danger plein' }, libelleConfirmer);
    confirmer.addEventListener('click', async () => {
      confirmer.disabled = true;
      try {
        await action();
      } catch (erreur) {
        annoncer(`Échec : ${erreur.message}`);
        confirmer.disabled = false;
      }
    });
    zone.replaceChildren(el('div', { class: 'alerte danger pile', role: 'alertdialog' },
      el('p', {}, el('strong', { text: question })),
      detail && el('p', { text: detail }),
      el('div', { class: 'rangee' },
        confirmer,
        el('button', { type: 'button', class: 'bouton', onclick: etapeInitiale }, 'Annuler'))));
    confirmer.focus();
  };
  etapeInitiale();
  return zone;
}

// ---- 10-base.js ----
/* Couche IndexedDB.
 *
 * Magasins :
 *   eleves  { id, donnees }  — donnees = élève encodé par le codec
 *   cartes  { id, donnees }  — état Leitner, id = id de l'élève
 *   meta    { cle, valeur }  — réglages et suivi, jamais de donnée personnelle
 *
 * Le codec transforme chaque objet avant écriture et après lecture.
 * Il est neutre tant que le chiffrement n'est pas activé.
 */

function attendreRequete(requete) {
  return new Promise((resoudre, rejeter) => {
    requete.onsuccess = () => resoudre(requete.result);
    requete.onerror = () => rejeter(requete.error);
  });
}

function attendreTransaction(tx) {
  return new Promise((resoudre, rejeter) => {
    tx.oncomplete = () => resoudre();
    tx.onerror = () => rejeter(tx.error);
    tx.onabort = () => rejeter(tx.error || new Error('Écriture annulée.'));
  });
}

const Base = {
  NOM: 'reconnaitre-mes-eleves',
  VERSION: 1,
  cnx: null,

  codec: {
    encoder: async (objet) => objet,
    decoder: async (donnees) => donnees,
  },

  ouvrir() {
    return new Promise((resoudre, rejeter) => {
      if (!('indexedDB' in window)) {
        rejeter(new Error("IndexedDB n'est pas disponible dans ce navigateur."));
        return;
      }
      const requete = indexedDB.open(this.NOM, this.VERSION);
      requete.onupgradeneeded = () => {
        const db = requete.result;
        if (!db.objectStoreNames.contains('eleves')) db.createObjectStore('eleves', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('cartes')) db.createObjectStore('cartes', { keyPath: 'id' });
        if (!db.objectStoreNames.contains('meta')) db.createObjectStore('meta', { keyPath: 'cle' });
      };
      requete.onsuccess = () => {
        this.cnx = requete.result;
        this.cnx.onversionchange = () => {
          this.cnx.close();
          this.cnx = null;
        };
        resoudre();
      };
      requete.onerror = () => rejeter(requete.error);
    });
  },

  async lireTout(magasin) {
    const tx = this.cnx.transaction(magasin, 'readonly');
    const enregistrements = await attendreRequete(tx.objectStore(magasin).getAll());
    return Promise.all(enregistrements.map((e) => this.codec.decoder(e.donnees)));
  },

  /**
   * Écritures et suppressions groupées dans une seule transaction.
   * L'encodage (asynchrone) est fait avant d'ouvrir la transaction,
   * sinon IndexedDB la validerait prématurément.
   */
  async modifier({ ecritures = {}, suppressions = {} }) {
    const magasins = [...new Set([...Object.keys(ecritures), ...Object.keys(suppressions)])];
    if (!magasins.length) return;

    const prets = {};
    for (const [magasin, objets] of Object.entries(ecritures)) {
      prets[magasin] = await Promise.all(
        objets.map(async (objet) => ({ id: objet.id, donnees: await this.codec.encoder(objet) })));
    }

    const tx = this.cnx.transaction(magasins, 'readwrite');
    const fin = attendreTransaction(tx);
    for (const [magasin, enregistrements] of Object.entries(prets)) {
      const store = tx.objectStore(magasin);
      for (const e of enregistrements) store.put(e);
    }
    for (const [magasin, ids] of Object.entries(suppressions)) {
      const store = tx.objectStore(magasin);
      for (const id of ids) store.delete(id);
    }
    await fin;
  },

  async lireMeta(cle) {
    const tx = this.cnx.transaction('meta', 'readonly');
    const enregistrement = await attendreRequete(tx.objectStore('meta').get(cle));
    return enregistrement ? enregistrement.valeur : undefined;
  },

  async ecrireMeta(cle, valeur) {
    const tx = this.cnx.transaction('meta', 'readwrite');
    const fin = attendreTransaction(tx);
    tx.objectStore('meta').put({ cle, valeur });
    await fin;
  },

  /** Supprime la base entière (pas seulement son contenu). */
  detruire(surBlocage) {
    if (this.cnx) {
      this.cnx.close();
      this.cnx = null;
    }
    return new Promise((resoudre, rejeter) => {
      const requete = indexedDB.deleteDatabase(this.NOM);
      requete.onsuccess = () => resoudre();
      requete.onerror = () => rejeter(requete.error);
      requete.onblocked = () => { if (surBlocage) surBlocage(); };
    });
  },
};

// ---- 20-etat.js ----
/* État de l'application en mémoire, synchronisé avec IndexedDB. */

const REGLAGES_DEFAUT = Object.freeze({
  nouvellesParJour: 15,
  tailleSession: 20,
  plafondRetard: 40,
  objectif: null,
  modeRevision: 'photo',
  decalageJours: 0,
});

const SUIVI_DEFAUT = Object.freeze({
  premierImport: null,
  persistanceDemandee: false,
  /** Première session du jour : { date, id }. Les suivantes sont en entraînement libre. */
  sessionAlgo: null,
  /** Nouvelles cartes introduites : { date, n }. */
  nouvellesDuJour: null,
});

const MOTIF_PHOTO = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;

/**
 * Liste blanche : seuls id, nom, prénom, classe et photo d'un élève
 * sont conservés. Tout autre champ (date de naissance, téléphone,
 * entreprise…) est écarté ici, avant toute écriture en base.
 */
function nettoyerEleve(source) {
  const texte = (valeur) => String(valeur ?? '').replace(/\s+/g, ' ').trim().slice(0, 80);
  return {
    id: typeof source.id === 'string' && source.id ? source.id : nouvelId(),
    nom: texte(source.nom),
    prenom: texte(source.prenom),
    classe: texte(source.classe),
    photo: typeof source.photo === 'string' && MOTIF_PHOTO.test(source.photo) ? source.photo : '',
  };
}

function nouvelleCarte(id) {
  return {
    id,
    compartiment: 1,
    introduite: null,
    echeance: null,
    passages: 0,
    reussites: 0,
    dernierPassage: null,
    dernierEchec: null,
  };
}

async function demanderPersistance() {
  if (!navigator.storage || !navigator.storage.persist) return false;
  try {
    if (await navigator.storage.persisted()) return true;
    return await navigator.storage.persist();
  } catch {
    return false;
  }
}

const Etat = {
  eleves: new Map(),
  cartes: new Map(),
  reglages: { ...REGLAGES_DEFAUT },
  suivi: { ...SUIVI_DEFAUT },
  /** Classe choisie dans le filtre, partagée par tous les écrans. */
  filtreClasse: null,

  async charger() {
    const [eleves, cartes, reglages, suivi] = await Promise.all([
      Base.lireTout('eleves'),
      Base.lireTout('cartes'),
      Base.lireMeta('reglages'),
      Base.lireMeta('suivi'),
    ]);
    this.eleves = new Map(eleves.map((e) => [e.id, e]));
    this.cartes = new Map(cartes.map((c) => [c.id, c]));
    this.reglages = { ...REGLAGES_DEFAUT, ...reglages };
    this.suivi = { ...SUIVI_DEFAUT, ...suivi };

    const manquantes = eleves.filter((e) => !this.cartes.has(e.id)).map((e) => nouvelleCarte(e.id));
    if (manquantes.length) {
      await Base.modifier({ ecritures: { cartes: manquantes } });
      for (const c of manquantes) this.cartes.set(c.id, c);
    }
  },

  classes() {
    const noms = new Set();
    for (const e of this.eleves.values()) if (e.classe) noms.add(e.classe);
    return [...noms].sort(comparerFr);
  },

  listeEleves(classe = null) {
    return [...this.eleves.values()]
      .filter((e) => !classe || e.classe === classe)
      .sort((a, b) => comparerFr(a.nom, b.nom) || comparerFr(a.prenom, b.prenom));
  },

  async ajouterEleves(sources) {
    const eleves = sources.map(nettoyerEleve);
    const cartes = eleves.map((e) => nouvelleCarte(e.id));
    await Base.modifier({ ecritures: { eleves, cartes } });
    for (const e of eleves) this.eleves.set(e.id, e);
    for (const c of cartes) this.cartes.set(c.id, c);
    if (!this.suivi.premierImport) await this.enregistrerSuivi({ premierImport: Dates.aujourdhui() });
    demanderPersistance();
    return eleves;
  },

  async modifierEleve(source) {
    const eleve = nettoyerEleve(source);
    await Base.modifier({ ecritures: { eleves: [eleve] } });
    this.eleves.set(eleve.id, eleve);
    return eleve;
  },

  async supprimerEleve(id) {
    await Base.modifier({ suppressions: { eleves: [id], cartes: [id] } });
    this.eleves.delete(id);
    this.cartes.delete(id);
  },

  async enregistrerCarte(carte) {
    await Base.modifier({ ecritures: { cartes: [carte] } });
    this.cartes.set(carte.id, carte);
  },

  async enregistrerReglages(changements) {
    Object.assign(this.reglages, changements);
    await Base.ecrireMeta('reglages', { ...this.reglages });
  },

  async enregistrerSuivi(changements) {
    Object.assign(this.suivi, changements);
    await Base.ecrireMeta('suivi', { ...this.suivi });
  },
};

function nuancer(hex, facteur) {
  const n = parseInt(hex.slice(1), 16);
  const canal = (decalage) => Math.min(255, Math.round(((n >> decalage) & 255) * facteur));
  return `rgb(${canal(16)}, ${canal(8)}, ${canal(0)})`;
}

/** Dessine un visage stylisé, reproductible à partir de la graine. Renvoie une data URL JPEG. */
function dessinerVisage(graine, taille = 400) {
  const alea = generateurAleatoire(hacherTexte(graine));
  const choisir = (liste) => liste[Math.floor(alea() * liste.length)];
  const entre = (min, max) => min + alea() * (max - min);

  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = taille;
  const ctx = canvas.getContext('2d');
  const u = taille / 100;
  const TOUR = Math.PI * 2;
  const ellipse = (x, y, rx, ry, debut = 0, fin = TOUR) => {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, debut, fin);
    ctx.fill();
  };

  const peau = choisir(TEINTES.peaux);
  const cheveux = choisir(TEINTES.cheveux);
  const coiffure = Math.floor(alea() * 6);
  const cx = 50 * u;
  const cy = entre(43, 47) * u;
  const rx = entre(15, 19) * u;
  const ry = entre(19.5, 23) * u;

  ctx.fillStyle = choisir(TEINTES.fonds);
  ctx.fillRect(0, 0, taille, taille);

  // Cheveux longs, derrière la tête
  if (coiffure === 3 || coiffure === 4) {
    ctx.fillStyle = cheveux;
    const longueur = coiffure === 4 ? 17 : 8;
    ellipse(cx, cy + longueur * 0.6 * u, rx + 5 * u, ry + longueur * u);
  }

  // Buste et cou
  ctx.fillStyle = choisir(TEINTES.vetements);
  ellipse(cx, 101 * u, entre(32, 40) * u, 24 * u);
  ctx.fillStyle = nuancer(peau, 0.9);
  ctx.fillRect(cx - 6 * u, cy + ry - 8 * u, 12 * u, 16 * u);

  // Oreilles et tête
  ctx.fillStyle = peau;
  for (const cote of [-1, 1]) ellipse(cx + cote * rx, cy + 2 * u, 3 * u, 5 * u);
  ellipse(cx, cy, rx, ry);

  // Cheveux sur la tête
  ctx.fillStyle = cheveux;
  switch (coiffure) {
    case 0: // courts
      ellipse(cx, cy - ry * 0.45, rx * 1.04, ry * 0.62, Math.PI, TOUR);
      break;
    case 1: // très courts
      ctx.globalAlpha = 0.6;
      ellipse(cx, cy - ry * 0.55, rx * 1.01, ry * 0.5, Math.PI, TOUR);
      ctx.globalAlpha = 1;
      break;
    case 2: { // mèche sur le côté
      const cote = alea() < 0.5 ? -1 : 1;
      ellipse(cx, cy - ry * 0.45, rx * 1.06, ry * 0.65, Math.PI, TOUR);
      ctx.beginPath();
      ctx.ellipse(cx + cote * rx * 0.35, cy - ry * 0.5, rx * 0.75, ry * 0.3, cote * 0.35, 0, TOUR);
      ctx.fill();
      break;
    }
    case 3: // mi-longs
    case 4: // longs
      ellipse(cx, cy - ry * 0.4, rx * 1.12, ry * 0.7, Math.PI, TOUR);
      break;
    default: // bouclés
      for (let a = Math.PI * 1.02; a <= Math.PI * 1.98; a += Math.PI / 10) {
        ellipse(cx + Math.cos(a) * rx, cy - ry * 0.2 + Math.sin(a) * ry * 0.85, 6 * u, 6 * u);
      }
      ellipse(cx, cy - ry * 0.5, rx * 0.95, ry * 0.55, Math.PI, TOUR);
  }

  // Yeux et sourcils
  const ey = cy - 1 * u;
  const ex = entre(6, 8) * u;
  const iris = choisir(TEINTES.yeux);
  const inclinaison = entre(-1.2, 1.2) * u;
  for (const cote of [-1, 1]) {
    ctx.fillStyle = '#FFFFFF';
    ellipse(cx + cote * ex, ey, 3.3 * u, 2.2 * u);
    ctx.fillStyle = iris;
    ellipse(cx + cote * ex, ey, 1.6 * u, 1.6 * u);
    ctx.strokeStyle = cheveux;
    ctx.lineWidth = entre(1, 1.8) * u;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + cote * (ex - 3.5 * u), ey - 5 * u);
    ctx.lineTo(cx + cote * (ex + 3.5 * u), ey - 5 * u + inclinaison);
    ctx.stroke();
  }

  // Nez et bouche
  ctx.strokeStyle = nuancer(peau, 0.75);
  ctx.lineWidth = 1.2 * u;
  ctx.beginPath();
  ctx.moveTo(cx, ey + 2 * u);
  ctx.lineTo(cx - 1.8 * u, ey + entre(7, 9) * u);
  ctx.lineTo(cx + 1.2 * u, ey + entre(8, 9.5) * u);
  ctx.stroke();

  ctx.strokeStyle = '#8A3B3B';
  ctx.lineWidth = 1.4 * u;
  ctx.beginPath();
  const largeurBouche = entre(3, 5.5) * u;
  ctx.arc(cx, ey + 9 * u, largeurBouche, Math.PI * 0.2, Math.PI * 0.8);
  ctx.stroke();

  // Détails distinctifs
  if (alea() < 0.28) { // lunettes
    ctx.strokeStyle = '#222222';
    ctx.lineWidth = 1 * u;
    for (const cote of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + cote * ex, ey, 4.6 * u, 0, TOUR);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(cx - ex + 4.6 * u, ey);
    ctx.lineTo(cx + ex - 4.6 * u, ey);
    ctx.stroke();
  }
  if (alea() < 0.12) { // barbe
    ctx.fillStyle = cheveux;
    ctx.globalAlpha = 0.45;
    ellipse(cx, cy + ry * 0.45, rx * 0.92, ry * 0.55, 0, Math.PI);
    ctx.globalAlpha = 1;
  }
  if (alea() < 0.18) { // boucles d'oreilles
    ctx.fillStyle = '#D4AF37';
    for (const cote of [-1, 1]) ellipse(cx + cote * rx, cy + 7.5 * u, 1.3 * u, 1.3 * u);
  }

  return canvas.toDataURL('image/jpeg', 0.8);
}

/* Navigation par ancre (#/ecran/parametre) et composants partagés. */

const Ecrans = {};

function lireRoute() {
  const [nom, param] = location.hash.replace(/^#\/?/, '').split('/');
  return { nom: nom || 'accueil', param: param === undefined ? null : decodeURIComponent(param) };
}

function aller(nom, param = null) {
  const cible = `#/${nom}${param === null ? '' : '/' + encodeURIComponent(param)}`;
  if (location.hash === cible) afficher();
  else location.hash = cible;
}

function definirTitre(texte) {
  $('#titre').textContent = texte;
  document.title = texte === 'Reconnaître mes élèves' ? texte : `${texte} · Reconnaître mes élèves`;
}

function majBandeauDate() {
  const bandeau = $('#bandeau-date');
  bandeau.hidden = Dates.decalage === 0;
  if (Dates.decalage !== 0) {
    const signe = Dates.decalage > 0 ? '+' : '−';
    bandeau.textContent = `Mode test : date simulée au ${Dates.formater(Dates.aujourdhui(), true)} `
      + `(${signe}${pluriel(Math.abs(Dates.decalage), 'jour')})`;
  }
}

/** Gestionnaire clavier de l'écran courant (remplacé à chaque affichage). */
let toucheEcran = null;
document.addEventListener('keydown', (evenement) => {
  if (toucheEcran && !['INPUT', 'TEXTAREA', 'SELECT'].includes(evenement.target.tagName)) toucheEcran(evenement);
});

async function afficher() {
  if (typeof Verrou !== 'undefined' && Verrou.verrouille) return;
  const { nom, param } = lireRoute();
  const ecran = Ecrans[nom] || Ecrans.accueil;
  const zone = $('#ecran');
  toucheEcran = null;
  zone.replaceChildren();
  document.body.classList.toggle('plein', Boolean(ecran.pleinEcran));
  definirTitre(ecran.titre);
  majBandeauDate();

  const retour = $('#retour');
  retour.hidden = !ecran.parent;
  if (ecran.parent) {
    retour.textContent = `‹ ${ecran.libelleRetour || Ecrans[ecran.parent].titreCourt}`;
    retour.onclick = () => (ecran.surRetour ? ecran.surRetour() : aller(ecran.parent));
  }

  window.scrollTo(0, 0);
  try {
    await ecran.rendre(zone, param);
  } catch (erreur) {
    console.error(erreur);
    zone.append(el('div', { class: 'alerte danger' }, `Erreur d'affichage : ${erreur.message}`));
  }
}

// ---- 50-leitner.js ----
/* Moteur Leitner calibré pour trois semaines, et files de révision. */

/** Jours d'attente avant la prochaine révision, pour les compartiments 1 à 5. */
const INTERVALLES = [1, 2, 3, 5, 8];
const SECONDES_PAR_CARTE = 8;
const MAX_REPRISES = 2;

const MODES = {
  photo: 'Photo → identité',
  identite: 'Identité → photo',
  qcm: 'QCM',
};

function estimerDuree(nombreCartes) {
  const minutes = Math.ceil((nombreCartes * SECONDES_PAR_CARTE) / 60);
  return nombreCartes === 0 ? '0 min' : `≈ ${minutes} min`;
}

const Leitner = {
  /** Résultat d'une réponse de la session algorithmique. Fonction pure. */
  appliquer(carte, reussi, jour) {
    const compartiment = reussi ? Math.min(5, carte.compartiment + 1) : 1;
    return {
      ...carte,
      compartiment,
      introduite: carte.introduite ?? jour,
      echeance: Dates.ajouter(jour, INTERVALLES[compartiment - 1]),
      passages: carte.passages + 1,
      reussites: carte.reussites + (reussi ? 1 : 0),
      dernierPassage: jour,
      dernierEchec: reussi ? carte.dernierEchec : jour,
    };
  },

  /** Nombre minimal de jours avant d'atteindre le compartiment 5 sans aucun échec. */
  joursAvantMaitrise(carte, jour) {
    if (carte.introduite === null) return INTERVALLES.slice(1, 4).reduce((a, b) => a + b, 0);
    if (carte.compartiment === 5) return 0;
    const attente = Math.max(0, Dates.ecart(jour, carte.echeance));
    return attente + INTERVALLES.slice(carte.compartiment, 4).reduce((a, b) => a + b, 0);
  },

  /** Révisions restantes (sans échec) pour atteindre le compartiment 5. */
  revisionsRestantes(carte) {
    if (carte.introduite === null) return 4;
    return 5 - carte.compartiment;
  },

  quotaNouvelles(jour) {
    const { nouvellesDuJour } = Etat.suivi;
    const dejaIntroduites = nouvellesDuJour && nouvellesDuJour.date === jour ? nouvellesDuJour.n : 0;
    return Math.max(0, Etat.reglages.nouvellesParJour - dejaIntroduites);
  },

  sessionAlgoFaite(jour) {
    return Boolean(Etat.suivi.sessionAlgo && Etat.suivi.sessionAlgo.date === jour);
  },

  cartesDeClasse(classe) {
    return Etat.listeEleves(classe).map((e) => Etat.cartes.get(e.id)).filter(Boolean);
  },

  /** Situation du jour pour une classe (ou toutes). */
  bilan(classe, jour = Dates.aujourdhui()) {
    const cartes = this.cartesDeClasse(classe);
    const dues = cartes
      .filter((c) => c.introduite !== null && c.echeance <= jour)
      .sort((a, b) => (a.echeance < b.echeance ? -1 : a.echeance > b.echeance ? 1 : a.compartiment - b.compartiment));
    const nouvelles = cartes.filter((c) => c.introduite === null);
    const quota = this.quotaNouvelles(jour);
    return {
      cartes,
      dues,
      enRetard: dues.filter((c) => c.echeance < jour).length,
      nouvelles,
      nouvellesDuJour: Math.min(quota, nouvelles.length),
      sessionAlgoFaite: this.sessionAlgoFaite(jour),
    };
  },


  /** Cartes les plus fragiles d'abord : compartiment bas, échec récent. */
  trierParFragilite(cartes) {
    const rang = (c) => (c.introduite === null ? 1.5 : c.compartiment);
    return [...cartes].sort((a, b) => rang(a) - rang(b)
      || (b.dernierEchec || '').localeCompare(a.dernierEchec || '')
      || (a.echeance || '').localeCompare(b.echeance || ''));
  },

  fileLibre(classe) {
    const cartes = this.cartesDeClasse(classe);
    const etudiees = cartes.filter((c) => c.introduite !== null);
    return this.trierParFragilite(etudiees.length ? etudiees : cartes).map((c) => c.id);
  },
};

/* ---------- Session de révision en cours ---------- */

const Session = {
  active: null,

  /**
   * type : 'jour' (algorithmique si c'est la première du jour), 'libre' ou 'cours'.
   */
  demarrer({ type, mode, classe, limiteDues = null }) {
    const jour = Dates.aujourdhui();
    const algo = type === 'jour' && !Leitner.sessionAlgoFaite(jour);
    this.active = {
      id: nouvelId(),
      type,
      mode,
      classe,
      algo,
      jour,
      limiteDues,
      duesPrises: 0,
      vues: new Set(),
      lot: 0,
      file: [],
      position: 0,
      resultats: [],
    };
    return this.chargerLot();
  },

  /** Cartes encore disponibles pour la session algorithmique : dues les plus anciennes, puis nouvelles. */
  resteAlgo() {
    const s = this.active;
    const b = Leitner.bilan(s.classe, s.jour);
    let dues = b.dues.filter((c) => !s.vues.has(c.id));
    if (s.limiteDues !== null) dues = dues.slice(0, Math.max(0, s.limiteDues - s.duesPrises));
    const nouvelles = b.nouvelles.filter((c) => !s.vues.has(c.id)).slice(0, b.nouvellesDuJour);
    return { dues: dues.map((c) => c.id), nouvelles: nouvelles.map((c) => c.id) };
  },

  /** Prépare le lot suivant. Renvoie le nombre de cartes ajoutées. */
  chargerLot() {
    const s = this.active;
    const taille = Etat.reglages.tailleSession;
    let ids;
    if (s.algo) {
      const { dues, nouvelles } = this.resteAlgo();
      ids = [...dues, ...nouvelles].slice(0, taille);
      s.duesPrises += ids.filter((id) => dues.includes(id)).length;
    } else {
      let candidats = Leitner.fileLibre(s.classe).filter((id) => !s.vues.has(id));
      if (!candidats.length) {
        s.vues.clear();
        candidats = Leitner.fileLibre(s.classe);
      }
      ids = s.type === 'cours' && s.lot === 0 ? candidats : candidats.slice(0, taille);
    }
    melanger(ids);
    s.file = ids.map((id) => ({ id, reprises: 0, reprise: false }));
    s.position = 0;
    s.resultats = [];
    s.lot += 1;
    for (const id of ids) s.vues.add(id);
    return ids.length;
  },

  /** Nombre de cartes que « continuer » proposerait. */
  restant() {
    const s = this.active;
    if (!s) return 0;
    if (s.algo) {
      const { dues, nouvelles } = this.resteAlgo();
      return dues.length + nouvelles.length;
    }
    return Leitner.fileLibre(s.classe).length;
  },

  elementCourant() {
    const s = this.active;
    return s && s.position < s.file.length ? s.file[s.position] : null;
  },

  async repondre(reussi) {
    const s = this.active;
    const element = this.elementCourant();
    if (!element) return;

    if (!element.reprise) {
      s.resultats.push({ id: element.id, reussi });
      const carte = Etat.cartes.get(element.id);
      if (s.algo && carte) {
        const nouvelle = carte.introduite === null;
        await Etat.enregistrerCarte(Leitner.appliquer(carte, reussi, s.jour));
        const suivi = {};
        if (!Leitner.sessionAlgoFaite(s.jour)) suivi.sessionAlgo = { date: s.jour, id: s.id };
        if (nouvelle) {
          const courant = Etat.suivi.nouvellesDuJour;
          suivi.nouvellesDuJour = { date: s.jour, n: (courant && courant.date === s.jour ? courant.n : 0) + 1 };
        }
        if (Object.keys(suivi).length) await Etat.enregistrerSuivi(suivi);
      }
    }
    // Une carte ratée revient en fin de lot, sans nouvelle notation.
    if (!reussi && element.reprises < MAX_REPRISES) {
      s.file.push({ id: element.id, reprises: element.reprises + 1, reprise: true });
    }
    s.position += 1;
  },

  arreter() {
    this.active = null;
  },
};

/* Écrans de révision : préparation, carte, fin de série, prochain cours. */

function lancerSession(options) {
  const nombre = Session.demarrer(options);
  if (!nombre) {
    Session.arreter();
    annoncer('Aucune carte à réviser pour cette sélection.');
    return;
  }
  aller('session');
}

/** Trois distracteurs pris dans la même classe, pour obliger à regarder le visage. */
function distracteurs(eleve) {
  const memeClasse = melanger(Etat.listeEleves(eleve.classe).filter((e) => e.id !== eleve.id));
  const choix = memeClasse.slice(0, 3);
  if (choix.length < 3) {
    const autres = melanger(Etat.listeEleves().filter((e) => e.classe !== eleve.classe));
    choix.push(...autres.slice(0, 3 - choix.length));
  }
  return choix;
}

function blocIdentite(eleve, variante = '') {
  return el('div', { class: `identite ${variante}` },
    el('div', { class: 'identite-nom', text: nomComplet(eleve) || 'Nom inconnu' }),
    el('div', { class: 'identite-classe', text: eleve.classe }));
}

function selecteurMode(auChangement) {
  return selecteur(Object.entries(MODES), Etat.reglages.modeRevision, async (mode) => {
    await Etat.enregistrerReglages({ modeRevision: mode });
    if (auChangement) auChangement(mode);
  }, 'Mode de révision');
}

Ecrans.reviser = {

            type: 'button',

/* ---------- Carte en cours ---------- */

Ecrans.session = {

  titreCourt: 'Révision',
  parent: 'accueil',
  libelleRetour: 'Arrêter',
  pleinEcran: true,
  surRetour() {

    aller(retour);
  },

    const s = Session.active;
    if (!s) {
      document.body.classList.remove('plein');

    }

    else rendreFinDeSerie(zone);
  },

function rendreCarte(zone, element) {
  const s = Session.active;
  const eleve = Etat.eleves.get(element.id);
  const carte = Etat.cartes.get(element.id);
  definirTitre(s.type === 'cours' ? `Prochain cours · ${s.classe}` : MODES[s.mode]);

  const scene = el('div', { class: 'scene' });
  const panneau = el('div', { class: 'panneau-reponse' });
  zone.append(el('div', { class: 'revision' },
    !s.algo && el('div', { class: 'bandeau-libre' },
      'Entraînement libre : compartiments et dates inchangés'),
    el('div', { class: 'revision-entete' },
      el('span', { text: `Carte ${s.position + 1} sur ${s.file.length}` }),
      element.reprise && el('span', { class: 'badge', text: 'À revoir' }),
      s.algo && carte.introduite === null && el('span', { class: 'badge', text: 'Nouvel élève' }),
      s.classe === null && el('span', { text: eleve.classe })),
    el('div', { class: 'carte-revision' }, scene, panneau)));

  if (s.mode === 'qcm') modeQcm(eleve, element, scene, panneau);
  else modeRetournement(eleve, s.mode, scene, panneau);
}

function boutonsAutoEvaluation() {
  const repondre = async (reussi) => {
    for (const b of rangee.querySelectorAll('button')) b.disabled = true;
    toucheEcran = null;
    await Session.repondre(reussi);
    afficher();
  };
  const rangee = el('div', { class: 'rangee auto-evaluation' },
    el('button', { type: 'button', class: 'bouton accent grand', onclick: () => repondre(false) }, 'Je ne savais pas'),
    el('button', { type: 'button', class: 'bouton principal grand', onclick: () => repondre(true) }, 'Je savais'));
  toucheEcran = (e) => {
    if (e.key === 'ArrowLeft' || e.key === '1') repondre(false);
    if (e.key === 'ArrowRight' || e.key === '2') repondre(true);
  };
  return rangee;
}

/** Modes 1 et 2 : on se représente la réponse, on retourne la carte, on s'auto-évalue. */
function modeRetournement(eleve, mode, scene, panneau) {
  if (mode === 'photo') scene.append(photoEleve(eleve, 'photo-revision'));
  else scene.append(blocIdentite(eleve, 'grande'));

  const retourner = () => {
    if (mode === 'identite') scene.replaceChildren(photoEleve(eleve, 'photo-revision'));
    panneau.replaceChildren(blocIdentite(eleve), boutonsAutoEvaluation());
  };
  panneau.append(
    el('p', { class: 'consigne', text: mode === 'photo'
      ? 'Nom, prénom, classe ?'
      : 'Représentez-vous son visage.' }),
    el('button', { type: 'button', class: 'bouton principal bloc grand', onclick: retourner }, 'Retourner la carte'));
  toucheEcran = (e) => {
    if (e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      retourner();
    }
  };
}

/** Mode 3 : quatre noms de la même classe, correction automatique. */
function modeQcm(eleve, element, scene, panneau) {
  if (!element.options) element.options = melanger([eleve, ...distracteurs(eleve)]).map((e) => e.id);
  scene.append(photoEleve(eleve, 'photo-revision'));

  const suite = el('div', { class: 'pile' });
  const grille = el('div', { class: 'choix' });
  let repondu = false;

  const choisir = async (id, bouton) => {
    if (repondu) return;
    repondu = true;
    const reussi = id === eleve.id;
    for (const b of grille.children) {
      b.disabled = true;
      if (b.dataset.id === eleve.id) b.classList.add('juste');
      else if (b === bouton) b.classList.add('faux');
    }
    toucheEcran = null;
    await Session.repondre(reussi);
    suite.replaceChildren(
      el('p', { class: 'verdict', text: reussi ? 'Bonne réponse' : `C’était ${nomComplet(eleve)}` }),
      el('button', { type: 'button', class: 'bouton principal bloc grand', onclick: afficher }, 'Suivant'));
    toucheEcran = (e) => {
      if (e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        afficher();
      }
    };
  };

  for (const id of element.options) {
    const option = Etat.eleves.get(id);
    if (!option) continue;
    const bouton = el('button', { type: 'button', class: 'bouton', 'data-id': id }, nomComplet(option));
    bouton.addEventListener('click', () => choisir(id, bouton));
    grille.append(bouton);
  }
  panneau.append(grille, suite);
  toucheEcran = (e) => {
    const rang = Number(e.key);
    if (rang >= 1 && rang <= grille.children.length) grille.children[rang - 1].click();
  };
}

/* ---------- Fin de série ---------- */

function rendreFinDeSerie(zone) {
  const s = Session.active;
  document.body.classList.remove('plein');
  definirTitre('Série terminée');
  toucheEcran = null;

  const reussies = s.resultats.filter((r) => r.reussi).length;
  const ratees = s.resultats.filter((r) => !r.reussi).map((r) => Etat.eleves.get(r.id)).filter(Boolean);
  const restant = Session.restant();
  const taille = Math.min(restant, Etat.reglages.tailleSession);

  const pile = el('div', { class: 'pile' },
    el('div', { class: 'chiffres' },
      chiffre(`${reussies} / ${s.resultats.length}`, 'reconnus du premier coup'),
      chiffre(ratees.length, 'à retravailler')));

  if (s.algo) {
    pile.append(el('p', { class: 'discret', text: restant
      ? `Il reste ${pluriel(restant, 'carte')} dans la session du jour.`
      : 'Session du jour terminée. Les prochaines sessions d’aujourd’hui seront en entraînement libre.' }));
  }

  if (ratees.length) {
    pile.append(el('section', { class: 'panneau pile' },
      el('h3', { text: 'À retravailler' }),
      el('div', { class: 'grille-eleves' }, ratees.map((e) => el('div', { class: 'tuile-eleve' },
        photoEleve(e, 'vignette'),
        el('span', { class: 'tuile-nom', text: nomComplet(e) }),
        el('span', { class: 'tuile-classe', text: e.classe }))))));
  }

  const actions = el('div', { class: 'rangee' });
  if (restant > 0) {
    actions.append(el('button', {
      type: 'button',
      class: 'bouton principal grand',
      onclick: () => {
        if (Session.chargerLot()) afficher();
        else annoncer('Plus aucune carte à proposer.');
      },
    }, `Continuer (${pluriel(taille, 'carte')})`));
  }
  actions.append(el('button', {
    type: 'button',
    class: 'bouton grand',
    onclick: () => {
      Session.arreter();
      aller('accueil');
    },
  }, 'Terminer'));
  pile.append(actions);
  zone.append(pile);
}

  parent: 'eleves',
  rendre(zone, id) {
    const eleve = Etat.eleves.get(id);
    if (!eleve) {
      zone.append(el('p', { text: 'Élève introuvable.' }));
      return;
    }
    definirTitre(nomComplet(eleve));

    const nom = el('input', { type: 'text', value: eleve.nom, autocomplete: 'off', required: true });
    const prenom = el('input', { type: 'text', value: eleve.prenom, autocomplete: 'off' });
    const classe = el('input', { type: 'text', value: eleve.classe, autocomplete: 'off', list: 'liste-classes' });
    const listeClasses = el('datalist', { id: 'liste-classes' }, Etat.classes().map((c) => el('option', { value: c })));

    const formulaire = el('form', { class: 'panneau pile' },
      champ('Nom', nom), champ('Prénom', prenom), champ('Classe', classe), listeClasses,
      el('button', { type: 'submit', class: 'bouton principal bloc' }, 'Enregistrer les modifications'));
    formulaire.addEventListener('submit', async (evenement) => {
      evenement.preventDefault();
      if (!nom.value.trim()) {
        annoncer('Le nom est obligatoire.');
        return;
      }
      const maj = await Etat.modifierEleve({ ...Etat.eleves.get(id), nom: nom.value, prenom: prenom.value, classe: classe.value });
      definirTitre(nomComplet(maj));
      annoncer('Fiche enregistrée.');
    });

    zone.append(el('div', { class: 'pile' },
      photoEleve(eleve, 'photo-fiche'),
      formulaire,
      el('section', { class: 'panneau' }, el('h3', { text: 'Progression' }), statistiquesEleve(Etat.cartes.get(id))),
      confirmationDeuxTemps({
        libelle: 'Supprimer cet élève',
        question: `Supprimer ${nomComplet(eleve)} ?`,
        detail: 'Sa photo et sa progression seront effacées.',
        libelleConfirmer: 'Oui, supprimer',
        action: async () => {
          await Etat.supprimerEleve(id);
          annoncer('Élève supprimé.');
          aller('eleves');
        },
      })));
  },
};

/* ---------- Réglages ---------- */

function champReglage(libelle, cle, min, max, aide) {
  const entree = el('input', { type: 'number', inputmode: 'numeric', min, max, step: 1, value: Etat.reglages[cle] });
  entree.addEventListener('change', async () => {
    let valeur = Math.round(Number(entree.value));
    if (!Number.isFinite(valeur) || entree.value === '') valeur = REGLAGES_DEFAUT[cle];
    valeur = Math.min(max, Math.max(min, valeur));
    entree.value = valeur;
    await Etat.enregistrerReglages({ [cle]: valeur });
    annoncer('Réglage enregistré.');
  });
  return champ(libelle, entree, aide);
}

async function decalerDate(jours) {
  const decalage = jours === null ? 0 : Etat.reglages.decalageJours + jours;
  await Etat.enregistrerReglages({ decalageJours: decalage });
  Dates.decalage = decalage;
  afficher();
}

  titre: 'Réglages et sauvegarde',
  titreCourt: 'Réglages',
  parent: 'accueil',

    const etatStockage = el('p', { class: 'discret', text: 'Vérification du stockage…' });

    const dejaDemo = demoDejaChargee();
    const boutonDemo = el('button', { type: 'button', class: 'bouton bloc', disabled: dejaDemo },
      dejaDemo ? 'Élèves fictifs déjà chargés' : 'Ajouter 36 élèves fictifs');
    boutonDemo.addEventListener('click', () => chargerDemo(boutonDemo));

    zone.append(el('div', { class: 'pile' },
      el('section', { class: 'panneau pile' },
        el('h2', { text: 'Charge de travail' }),
        champReglage('Nouvelles cartes par jour', 'nouvellesParJour', 1, 150),
        champReglage('Cartes par série', 'tailleSession', 5, 200, 'Un bouton « continuer » permet d’aller au-delà.'),
        champReglage('Cartes en retard traitées au maximum', 'plafondRetard', 5, 500,
          'En cas de gros retard, seules les plus anciennes sont proposées.')),

      sectionSauvegarde(),
      sectionMotDePasse(),

      el('section', { class: 'panneau pile' },
        el('h2', { text: 'Stockage' }),
        etatStockage),

      el('section', { class: 'panneau pile' },
        el('h2', { text: 'Données de démonstration' }),
        el('p', { class: 'discret', text: 'Noms inventés et visages dessinés, pour tester sans PDF.' }),
        boutonDemo),

      el('section', { class: 'panneau pile' },
        el('h2', { text: 'Test : simuler une date' }),
        el('p', { class: 'discret', text: `Date utilisée : ${Dates.formater(Dates.aujourdhui(), true)}. `
          + 'Permet de vérifier le passage des jours et le rappel des 60 jours.' }),
        el('div', { class: 'rangee' },
          el('button', { type: 'button', class: 'bouton', onclick: () => decalerDate(-1) }, '− 1 jour'),
          el('button', { type: 'button', class: 'bouton', onclick: () => decalerDate(1) }, '+ 1 jour'),
          el('button', { type: 'button', class: 'bouton', onclick: () => decalerDate(7) }, '+ 7 jours'),
          el('button', { type: 'button', class: 'bouton', onclick: () => decalerDate(null), disabled: Dates.decalage === 0 }, 'Date réelle'))),

      el('section', { class: 'panneau pile' },
        el('h2', { text: 'Effacement' }),
        el('p', { text: 'Supprime la base de données entière de cet appareil : élèves, photos, progression, mot de passe.' }),
        effacementComplet())));

    const persistant = navigator.storage && navigator.storage.persisted ? await navigator.storage.persisted() : false;
    const estimation = navigator.storage && navigator.storage.estimate ? await navigator.storage.estimate() : null;
    etatStockage.textContent = (persistant
      ? 'Stockage persistant accordé : le navigateur ne purgera pas les données.'
      : 'Stockage non persistant : le navigateur pourrait purger les données en cas de manque d’espace.')
      + (estimation ? ` Espace utilisé : ${formaterOctets(estimation.usage || 0)}.` : '');
  },
};

function sectionSauvegarde() { return el('section', { class: 'panneau' }, el('h2', { text: 'Sauvegarde' })); }
function sectionMotDePasse() { return null; }
Ecrans.tableau = { titre: 'Tableau de bord', titreCourt: 'Tableau', parent: 'accueil', rendre() {} };
Ecrans.import = { titre: 'Import', titreCourt: 'Import', parent: 'accueil', rendre() {} };

// ---- 99-demarrage.js ----
async function demarrer() {
  try {
    await Base.ouvrir();
    await Etat.charger();
    Dates.decalage = Etat.reglages.decalageJours || 0;

    if (!Etat.suivi.persistanceDemandee) {
      await demanderPersistance();
      await Etat.enregistrerSuivi({ persistanceDemandee: true });
    }

    window.addEventListener('hashchange', afficher);
    await afficher();
  } catch (erreur) {
    console.error(erreur);
    $('#ecran').replaceChildren(el('div', { class: 'alerte danger pile' },
      el('h2', { text: 'Impossible d’ouvrir la base locale' }),
      el('p', { text: erreur.message }),
      el('p', { text: 'La navigation privée bloque souvent IndexedDB. Ouvrez l’application dans une fenêtre normale.' })));
  }
}

demarrer();
